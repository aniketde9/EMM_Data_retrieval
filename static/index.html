<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EMM Pipeline</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: 0.75rem; }
    input, button { padding: 0.6rem; font-size: 1rem; }
    #status { margin-top: 1rem; font-weight: 600; }
    #download { margin-top: 0.5rem; display: none; }
  </style>
</head>
<body>
  <h1>Extra Mile Method Automation</h1>
  <form id="emm-form">
    <input name="author_name" placeholder="Author Name" required />
    <input name="book_title" placeholder="Book Title" required />
    <input type="url" name="website_url" placeholder="Author Website URL" required />
    <input name="linkedin_username" placeholder="LinkedIn Username" required />
    <input type="url" name="amazon_url" placeholder="Amazon Book URL" required />
    <button type="submit">Submit</button>
  </form>

  <div id="status"></div>
  <a id="download" href="#">Download PDF</a>

  <script>
    const statusMap = {
      queued: "In queue...",
      scraping_linkedin: "Pulling LinkedIn data...",
      scraping_web: "Researching author across the web...",
      reviewing: "Building research dossier...",
      generating: "Running intelligence analysis...",
      assembling: "Assembling EMM document...",
      exporting: "Generating PDF...",
      complete: "Done. Download ready.",
      failed: "Something went wrong."
    };

    const form = document.getElementById("emm-form");
    const statusEl = document.getElementById("status");
    const downloadEl = document.getElementById("download");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      downloadEl.style.display = "none";

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      const res = await fetch("/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = data.detail || "Submission failed.";
        return;
      }

      const jobId = data.job_id;
      statusEl.textContent = statusMap.queued;

      const poller = setInterval(async () => {
        const statusRes = await fetch(`/api/status/${jobId}`);
        const job = await statusRes.json();
        if (!statusRes.ok) {
          statusEl.textContent = "Unable to fetch status.";
          clearInterval(poller);
          return;
        }

        if (job.status === "failed") {
          statusEl.textContent = `${statusMap.failed} ${job.error || ""}`.trim();
          clearInterval(poller);
          return;
        }

        statusEl.textContent = statusMap[job.status] || job.status;
        if (job.status === "complete") {
          downloadEl.href = `/api/download/${jobId}`;
          downloadEl.style.display = "inline-block";
          clearInterval(poller);
        }
      }, 5000);
    });
  </script>
</body>
</html>
